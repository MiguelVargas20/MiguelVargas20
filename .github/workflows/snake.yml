name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"   # se actualiza sola cada 12 horas
  workflow_dispatch:          # botón para ejecutarla a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#f2a541
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f2a541

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
